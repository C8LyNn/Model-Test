name: C01-02 W27 exact-native independent mesh QA
on:
  push:
    branches: [c01/props-02-independent-qa]
    paths:
      - C01InteriorProps_QA/W27/independent_native_3.py
      - .github/workflows/c01-02-w27-independent-native.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-original-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - name: Checkout existing C01-02 isolated QA Draft (read-only source)
        uses: actions/checkout@v4
        with:
          path: qa
          lfs: false
          persist-credentials: false
      - name: Checkout pinned P15-03 producer Draft source (no delegated ship doors)
        uses: actions/checkout@v4
        with:
          ref: 7eef12868dd214852e44adf72d4b76200c382487
          path: qa/producers/p15
          lfs: false
          persist-credentials: false
      - name: Checkout pinned P18-03 isolated producer Draft source
        uses: actions/checkout@v4
        with:
          ref: 7377d51ee43796609aeb9eac0fa3bc6d4c3f29cf
          path: qa/producers/p18
          lfs: false
          persist-credentials: false
      - name: Checkout pinned P19-03 producer Draft source
        uses: actions/checkout@v4
        with:
          ref: e053a786ffe8f08e5121c3ae5aa0f974a629660d
          path: qa/producers/p19
          lfs: false
          persist-credentials: false
      - name: Install Blender4, NumPy and Git LFS
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y blender python3-numpy git-lfs
          blender --version | head -1
          git lfs version
      - name: Hydrate exactly six CURRENT native binaries from signed producer refs
        working-directory: qa
        run: |
          git -C producers/p15 lfs pull --include="Assets/C01InteriorProps/P15/Sources/Blender/P15-03.blend,Assets/C01InteriorProps/P15/Models/FBX/P15-03.fbx" --exclude=""
          git -C producers/p18 lfs pull --include="Assets/C01InteriorProps/C01-18/Sources/P18-03.blend,Assets/C01InteriorProps/C01-18/Models/P18-03.fbx" --exclude=""
          git -C producers/p19 lfs pull --include="Assets/C01InteriorProps/C01-19/Models/P19-03/P19-03.blend,Assets/C01InteriorProps/C01-19/Models/P19-03/P19-03.fbx" --exclude=""
      - name: Execute separate C01-02 Blender native+FBX audit, UV/normal and motion
        working-directory: qa
        run: |
          set -o pipefail
          blender -b -t 2 --python C01InteriorProps_QA/W27/independent_native_3.py -- "$PWD/producers" 2>&1 | tee c01_w27_independent_blender.log
      - name: Upload authentic independent results; NOT Unity acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c01-02-w27-independent-three-original-native
          path: |
            qa/C01InteriorProps_QA/W27/runtime-results/*.json
            qa/c01_w27_independent_blender.log
          if-no-files-found: warn
          retention-days: 30
