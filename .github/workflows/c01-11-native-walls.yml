name: C01-11 PASS04 - read-only native Blender FBX audit
on:
  push:
    branches:
      - c01/walls-11-wave02-native-export
    paths:
      - 'Assets/C01Architecture/Walls_W01_W04/Sources/pass03_native_topology_audit.py'
      - 'Assets/C01Architecture/Walls_W01_W04/Sources/check_artifacts.py'
      - '.github/workflows/c01-11-native-walls.yml'
  workflow_dispatch:
concurrency:
  group: c01-11-pass04-native-audit
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  native-mesh-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - name: Install real Blender and FBX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy git-lfs xvfb xauth libegl1 libgl1 libopengl0
      - name: Check actual committed native assets (no generation)
        run: |
          python3 Assets/C01Architecture/Walls_W01_W04/Sources/check_artifacts.py
      - name: Inspect genuine Blender sources and FBX reimport
        run: |
          xvfb-run -a blender -b --factory-startup --python-exit-code 1 --python Assets/C01Architecture/Walls_W01_W04/Sources/pass03_native_topology_audit.py
      - name: Export QA evidence without changing repository
        uses: actions/upload-artifact@v4
        with:
          name: C01-11-PASS04-readonly-native-FBX-QA
          if-no-files-found: error
          path: |
            Assets/C01Architecture/Walls_W01_W04/QA/PASS03_blender_fbx_roundtrip.json
            Assets/C01Architecture/Walls_W01_W04/QA/W0*_mesh_topology_*.json
            Assets/C01Architecture/Walls_W01_W04/Previews/W0*_PASS03_*.png
      - name: Confirm original tracked sources unchanged
        run: |
          git diff --exit-code -- Assets/C01Architecture/Walls_W01_W04/Blender Assets/C01Architecture/Walls_W01_W04/FBX
