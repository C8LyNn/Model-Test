name: C01-18 W20 P18-07 Native BLEND FBX Hinge Motion QA
on:
  push:
    branches: [c01/props-18-cargo-wave02]
    paths:
      - '.github/workflows/c01-18-w20-p1807-hinge-qa.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: c01-18-w20-p1807-motion
  cancel-in-progress: false
jobs:
  blender-hinge-native-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: true
      - name: Install real Blender4 with exporter dependencies
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include='Assets/C01InteriorProps/C01-18-Wave02/Sources/P18-07.blend,Assets/C01InteriorProps/C01-18-Wave02/Models/P18-07.fbx' --exclude=''
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy
          blender --version | grep -E '^Blender 4\.'
      - name: Real native source and reimported FBX 0-110 hinge BVH audit
        run: |
          set -euo pipefail
          root="$PWD/Assets/C01InteriorProps/C01-18-Wave02"
          blender -b --factory-startup --python-exit-code 1 --python "$root/Tools/pass20_native_motion_p1807.py" -- "$root"
          test -s "$root/QA/Pass20/P18-07_NATIVE_HINGE_BVH_SWEEP.json"
          python3 - <<'PY'
          import json
          p="Assets/C01InteriorProps/C01-18-Wave02/QA/Pass20/P18-07_NATIVE_HINGE_BVH_SWEEP.json"
          x=json.load(open(p))
          assert x['source']['angles_tested']==23
          assert x['binary_fbx_reimport']['angles_tested']==23
          assert x['source_fbx_pair_agreement']
          assert abs(x['binary_fbx_reimport']['front_plane_outward_offset_mm']-1)<0.05
          print("C01_W20_HINGE_NATIVE_MEASURED",x['binary_fbx_reimport']['blocking_contact_pairs'])
          PY
      - name: Commit measured SHA-pinned QA report ONLY, no asset re-export
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          f=Assets/C01InteriorProps/C01-18-Wave02/QA/Pass20/P18-07_NATIVE_HINGE_BVH_SWEEP.json
          git add "$f"
          if git diff --cached --quiet; then
            echo 'No QA change'
          else
            test "$(git diff --cached --name-only)" = "$f"
            git commit -m "C01-18 W20: measured actual P18-07 native Blender FBX hinge clearance QA [skip ci]"
            git push origin 'HEAD:c01/props-18-cargo-wave02'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: C01-18-W20-P18-07-NATIVE-HINGE-QA
          path: Assets/C01InteriorProps/C01-18-Wave02/QA/Pass20/P18-07_NATIVE_HINGE_BVH_SWEEP.json
          if-no-files-found: warn
          retention-days: 21
