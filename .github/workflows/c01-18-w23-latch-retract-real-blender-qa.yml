name: C01-18 W23 Real Blender FBX P18-07 Visual Latch Retract QA
# W23 corrected world-space BVH (original test erroneously returned LOCAL space collisions)
on:
  push:
    branches: [c01/props-18-cargo-wave02]
    paths:
      - '.github/workflows/c01-18-w23-latch-retract-real-blender-qa.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test-real-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Hydrate exact physical original BLEND+binary FBX and Blender4
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include='Assets/C01InteriorProps/C01-18-Wave02/Sources/P18-07.blend,Assets/C01InteriorProps/C01-18-Wave02/Models/P18-07.fbx' --exclude=''
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy
          blender --version | grep -E '^Blender 4\.'
      - name: Actual Blender and FBX 23-angle latch retract search, signed immutable data
        run: |
          set -euo pipefail
          root="$PWD/Assets/C01InteriorProps/C01-18-Wave02"
          blender -b --factory-startup --python-exit-code 1 --python "$root/Tools/pass23_real_latch_retract_search.py" -- "$root"
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('Assets/C01InteriorProps/C01-18-Wave02/QA/Pass23/P18-07_REAL_SIGNED_LATCH_RETRACT_BVH.json')
          a=json.loads(p.read_text())
          assert a['selected_geometric_retract']
          assert a['selected_geometric_retract']['contact_count_source']==0
          assert a['selected_geometric_retract']['contact_count_imported_fbx']==0
          assert a['native_asset_changes']==a['exports']==0
          assert len(a['sampled_lid_angles_deg'])==23
          print('P18-07_REAL_RETRACT_SIGNED_SOURCE_AND_IMPORT_PASS')
          PY
      - name: Commit QA-only evidence to own Draft branch, never edit FBX/BLEND
        run: |
          set -euo pipefail
          p=Assets/C01InteriorProps/C01-18-Wave02/QA/Pass23/P18-07_REAL_SIGNED_LATCH_RETRACT_BVH.json
          git add "$p"
          test "$(git diff --cached --name-only)" = "$p"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'C01-18 W23: actual native Blender and FBX P18-07 visual lock retract evidence [skip ci]'
          git push origin HEAD:c01/props-18-cargo-wave02
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: C01-18-W23-ACTUAL-SIGNED-P18-07-LATCH-RETRACT
          path: Assets/C01InteriorProps/C01-18-Wave02/QA/Pass23/P18-07_REAL_SIGNED_LATCH_RETRACT_BVH.json
          if-no-files-found: warn
          retention-days: 21
