name: C01-18 W26 P18-03 Actual Native Hub Clearance
on:
  push:
    branches: [c01/18-w26-p1803-hub-fork-clearance]
    paths:
      - 'Assets/C01InteriorProps/C01-18/Models/P18-03.obj'
      - 'Assets/C01InteriorProps/C01-18/Sources/build_blender.py'
      - 'Assets/C01InteriorProps/C01-18/QA/Pass26/*.py'
      - '.github/workflows/c01-18-w26-p1803-hub-clearance.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: c01-18-w26-p1803-native
  cancel-in-progress: false
jobs:
  original-blender-export-and-fbx-roundtrip:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
          persist-credentials: true
      - name: Install real Blender 4.x, LFS, NumPy and headless rendering
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy git-lfs xvfb libgl1-mesa-dri
          git lfs install --local
          blender --version
      - name: Recover immutable original P18-03 OBJ from parent commit
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c01-baseline"
          git show 6f178a17a566294ef0be7654b2dee516062bb9b1:Assets/C01InteriorProps/C01-18/Models/P18-03.obj | git lfs smudge > "$RUNNER_TEMP/c01-baseline/P18-03-before.obj"
          test "$(stat -c %s "$RUNNER_TEMP/c01-baseline/P18-03-before.obj")" -gt 100000
          grep -q '^o Wheel_LB_Hub_In$' "$RUNNER_TEMP/c01-baseline/P18-03-before.obj"
      - name: Native Blender4 regenerate ONLY modified P18-03 (never P18-01/02 or doors)
        run: |
          set -euo pipefail
          blender -b --python Assets/C01InteriorProps/C01-18/Sources/build_blender.py -- \
            "$PWD/Assets/C01InteriorProps/C01-18" --only P18-03
      - name: Native saved BLEND plus real binary FBX reimport, clearance, preview evidence
        run: |
          set -euo pipefail
          xvfb-run -a blender -b --python Assets/C01InteriorProps/C01-18/QA/Pass26/p1803_real_blender_fbx_qa.py -- \
            "$PWD/Assets/C01InteriorProps/C01-18" \
            "$RUNNER_TEMP/c01-baseline/P18-03-before.obj" \
            "$PWD/Assets/C01InteriorProps/C01-18/QA/Pass26"
      - name: Sync P18-03 exact current SHA/size guard and manifest (not historical SHA)
        run: |
          set -euo pipefail
          python3 Assets/C01InteriorProps/C01-18/QA/Pass26/p1803_w26_sign_native.py "$PWD"
          grep -q "PRODUCER_NATIVE_CLEARANCE_PASS" Assets/C01InteriorProps/C01-18/QA/Pass26/P18-03_W26_REAL_BLENDER_FBX_QA.json
      - name: Commit tested original model repairs and before/after proofs to isolated W26 branch only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --renormalize Assets/C01InteriorProps/C01-18/Models/P18-03.obj
          git add \
            Assets/C01InteriorProps/C01-18/Models/P18-03.obj \
            Assets/C01InteriorProps/C01-18/Models/P18-03.fbx \
            Assets/C01InteriorProps/C01-18/Sources/P18-03.blend \
            Assets/C01InteriorProps/C01-18/Editor/BuildWave01CargoPrefabs.cs \
            Assets/C01InteriorProps/C01-18/Manifests/manifest.json \
            Assets/C01InteriorProps/C01-18/QA/Pass26/P18-03_W26_REAL_BLENDER_FBX_QA.json \
            Assets/C01InteriorProps/C01-18/QA/Pass26/*.png
          git diff --cached --name-only
          git diff --cached --name-only | grep -q 'P18-03.fbx'
          if git diff --cached --name-only | grep -E '(D01|D02|Doors|Gates|P18-01|P18-02)'; then
            echo "FORBIDDEN MODEL CHANGE"; exit 1
          fi
          git commit -m "C01-18 W26: signed native P18-03 hub clearance with Blender proofs [skip ci]"
          git push origin HEAD:c01/18-w26-p1803-hub-fork-clearance
      - name: Upload genuine native and before/after PNG proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: C01-18-W26-P18-03-real-native-blend-fbx-and-previews
          path: |
            Assets/C01InteriorProps/C01-18/Sources/P18-03.blend
            Assets/C01InteriorProps/C01-18/Models/P18-03.fbx
            Assets/C01InteriorProps/C01-18/QA/Pass26/P18-03_W26_REAL_BLENDER_FBX_QA.json
            Assets/C01InteriorProps/C01-18/QA/Pass26/*.png
          if-no-files-found: warn
          retention-days: 14
