name: C01-19 Wave02 Native Blender FBX
on:
  push:
    branches: [c01/props-19-furniture-wave02]
    paths:
      - 'Assets/C01InteriorProps/C01-19-W02/Source/wave02_parts.json'
      - 'Assets/C01InteriorProps/C01-19-W02/Source/blender_export_wave02.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  blender-wave02:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install Blender 4 and Git LFS
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy git-lfs xvfb xauth libegl1 libgl1 libopengl0
          git lfs install --local
      - name: Export actual native Blender FBX and 12 PNG renders
        run: xvfb-run -a blender -b --factory-startup --python-exit-code 1 --python Assets/C01InteriorProps/C01-19-W02/Source/blender_export_wave02.py
      - name: Validate actual Blender FBX + preview output
        run: python3 Assets/C01InteriorProps/C01-19-W02/QA/validate_native.py
      - name: Upload real native deliverables
        uses: actions/upload-artifact@v4
        with:
          name: C01-19-W02-native-blend-fbx-renders
          if-no-files-found: error
          path: |
            Assets/C01InteriorProps/C01-19-W02/Models/*/*.blend
            Assets/C01InteriorProps/C01-19-W02/Models/*/*.fbx
            Assets/C01InteriorProps/C01-19-W02/Previews/*.png
            Assets/C01InteriorProps/C01-19-W02/QA/blender_native_validation.json
      - name: Commit native outputs with LFS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets/C01InteriorProps/C01-19-W02/Models Assets/C01InteriorProps/C01-19-W02/Previews Assets/C01InteriorProps/C01-19-W02/QA/blender_native_validation.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build(C01-19-W02): native Blender FBX and model previews via LFS"
          git push origin HEAD:c01/props-19-furniture-wave02
