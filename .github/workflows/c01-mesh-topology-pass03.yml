name: C01-01 PASS03 Actual Blender Mesh Audit
on:
  push:
    branches:
      - c01/standards-mesh-topology-pass03
  pull_request:
    paths:
      - 'Tools/c01_mesh_repair/**'
      - 'Tests/c01_mesh_repair/**'
      - '.github/workflows/c01-mesh-topology-pass03.yml'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  native-fixture-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install actual Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender
          blender --version | head -n 2
      - name: Compile audit source
        run: python3 -m py_compile Tools/c01_mesh_repair/topology_audit.py Tests/c01_mesh_repair/test_topology_blender.py Tools/c01_mesh_repair/compare_topology_reports.py Tests/c01_mesh_repair/test_compare_reports.py
      - name: Compare report safety tests (10/10)
        run: python3 -m unittest discover -s Tests/c01_mesh_repair -p test_compare_reports.py -v
      - name: Execute five REAL Blender runtime fixture tests
        run: blender --background --factory-startup --python-exit-code 13 --python Tests/c01_mesh_repair/test_topology_blender.py

  six-producer-sources:
    needs: native-fixture-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: standards
          lfs: false
      - uses: actions/checkout@v4
        with:
          ref: c01/props-17-wave02
          path: source17
          lfs: true
      - uses: actions/checkout@v4
        with:
          ref: c01/props-18-cargo-wave02
          path: source18
          lfs: true
      - uses: actions/checkout@v4
        with:
          ref: c01/props-19-furniture-wave02
          path: source19
          lfs: true
      - name: Install actual Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender
          blender --version | head -n 2
      - name: Capture producer commit identities
        run: |
          mkdir -p reports
          {
            echo "C01-01 PASS03 P0 source branch revisions"
            for d in source17 source18 source19; do
              printf '%s ' "$d"
              git -C "$d" rev-parse HEAD
            done
          } | tee reports/producer_source_revisions.txt
      - name: Audit six ORIGINAL .blend source meshes (READ ONLY)
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            "P17-04|source17/C01InteriorProps_W02/Blender/P17-04.blend"
            "P17-05|source17/C01InteriorProps_W02/Blender/P17-05.blend"
            "P18-04|source18/Assets/C01InteriorProps/C01-18-Wave02/Sources/P18-04.blend"
            "P18-05|source18/Assets/C01InteriorProps/C01-18-Wave02/Sources/P18-05.blend"
            "P19-07|source19/Assets/C01InteriorProps/C01-19-W02/Models/P19-07/P19-07.blend"
            "P19-08|source19/Assets/C01InteriorProps/C01-19-W02/Models/P19-08/P19-08.blend"
          )
          for entry in "${paths[@]}"; do
            asset="${entry%%|*}"
            file="${entry#*|}"
            test -s "$file"
            magic="$(head -c 7 "$file")"
            if [[ "$magic" != "BLENDER" ]]; then
              echo "::error::Source $asset is not native hydrated .blend at $file"
              exit 3
            fi
            mkdir -p "reports/$asset"
            blender --background "$file" --python-exit-code 13 --python standards/Tools/c01_mesh_repair/topology_audit.py -- --asset-id "$asset" --stage BEFORE --out "reports/$asset/mesh_topology_before.json"
          done
      - name: Re-import six existing binary FBX exports into native Blender
        shell: bash
        run: |
          set -euo pipefail
          entries=(
            "P17-04|source17/C01InteriorProps_W02/Blender/P17-04.blend|source17/Assets/C01InteriorProps/W02/Models/P17-04.fbx"
            "P17-05|source17/C01InteriorProps_W02/Blender/P17-05.blend|source17/Assets/C01InteriorProps/W02/Models/P17-05.fbx"
            "P18-04|source18/Assets/C01InteriorProps/C01-18-Wave02/Sources/P18-04.blend|source18/Assets/C01InteriorProps/C01-18-Wave02/Models/P18-04.fbx"
            "P18-05|source18/Assets/C01InteriorProps/C01-18-Wave02/Sources/P18-05.blend|source18/Assets/C01InteriorProps/C01-18-Wave02/Models/P18-05.fbx"
            "P19-07|source19/Assets/C01InteriorProps/C01-19-W02/Models/P19-07/P19-07.blend|source19/Assets/C01InteriorProps/C01-19-W02/Models/P19-07/P19-07.fbx"
            "P19-08|source19/Assets/C01InteriorProps/C01-19-W02/Models/P19-08/P19-08.blend|source19/Assets/C01InteriorProps/C01-19-W02/Models/P19-08/P19-08.fbx"
          )
          failed=0
          for entry in "${entries[@]}"; do
            IFS='|' read -r asset file fbx <<< "$entry"
            if ! blender --background "$file" --python-exit-code 13 --python standards/Tools/c01_mesh_repair/inspect_existing_fbx.py -- --asset-id "$asset" --fbx "$fbx" --out "reports/$asset/fbx_import_blender.json"; then
              echo "::error::Real Blender FBX import/geometry difference on $asset"
              failed=1
            fi
          done
          exit "$failed"
      - name: Upload actual FBX importer reports (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: C01-01-PASS03-SIX-FBX-NATIVE-BLENDER-REIMPORT
          path: reports/
          if-no-files-found: warn
      - name: Guarded repair candidates only when source still has detected split surfaces
        shell: bash
        run: |
          set -euo pipefail
          for id in P17-04 P17-05; do
            if [[ "$id" == "P17-04" ]]; then
              file=source17/C01InteriorProps_W02/Blender/P17-04.blend
            else
              file=source17/C01InteriorProps_W02/Blender/P17-05.blend
            fi
            if python3 - "$id" <<'PY'
          import json,sys
          aid=sys.argv[1]
          d=json.load(open(f"reports/{aid}/mesh_topology_before.json"))
          issues=d["totals"]
          if issues.get("boundary_edges",0) or issues.get("colocated_vertex_candidates",0):
              print("ORIGINAL_SOURCE_NEEDS_SAFE_REPAIR",aid)
              sys.exit(0)
          print("SOURCE_ALREADY_CLEAN_NO_REPAIR_CREATED",aid)
          sys.exit(1)
          PY
            then
              blender --background "$file" --python-exit-code 13 --python standards/Tools/c01_mesh_repair/safe_box_weld_candidate.py -- --asset-id "$id" --output-dir "repaired/$id"
              test -s "repaired/$id/REPAIR_AND_FBX_ROUNDTRIP.json"
            fi
          done
      - name: Upload repaired COPIES + native FBX reimport evidence (pending owner/QA)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: C01-01-PASS03-P17-04-05-REPAIR-CANDIDATES
          path: repaired/
          if-no-files-found: warn
      - name: Publish measured original source audits (not repaired models)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: C01-01-PASS03-SIX-ORIGINAL-BLEND-AUDITS
          path: reports/
          if-no-files-found: warn
