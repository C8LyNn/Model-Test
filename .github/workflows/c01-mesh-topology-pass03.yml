name: C01-01 PASS03 Actual Blender Mesh Audit
on:
  push:
    branches:
      - c01/standards-mesh-topology-pass03
  pull_request:
    paths:
      - 'Tools/c01_mesh_repair/**'
      - 'Tests/c01_mesh_repair/**'
      - '.github/workflows/c01-mesh-topology-pass03.yml'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  native-fixture-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install actual Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender
          blender --version | head -n 2
      - name: Compile audit source
        run: python3 -m py_compile Tools/c01_mesh_repair/topology_audit.py Tests/c01_mesh_repair/test_topology_blender.py
      - name: Execute five REAL Blender runtime fixture tests
        run: blender --background --factory-startup --python Tests/c01_mesh_repair/test_topology_blender.py

  six-producer-sources:
    needs: native-fixture-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: standards
          lfs: false
      - uses: actions/checkout@v4
        with:
          ref: c01/props-17-wave02
          path: source17
          lfs: true
      - uses: actions/checkout@v4
        with:
          ref: c01/props-18-cargo-wave02
          path: source18
          lfs: true
      - uses: actions/checkout@v4
        with:
          ref: c01/props-19-furniture-wave02
          path: source19
          lfs: true
      - name: Install actual Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender
          blender --version | head -n 2
      - name: Capture producer commit identities
        run: |
          mkdir -p reports
          {
            echo "C01-01 PASS03 P0 source branch revisions"
            for d in source17 source18 source19; do
              printf '%s ' "$d"
              git -C "$d" rev-parse HEAD
            done
          } | tee reports/producer_source_revisions.txt
      - name: Audit six ORIGINAL .blend source meshes (READ ONLY)
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            "P17-04|source17/C01InteriorProps_W02/Blender/P17-04.blend"
            "P17-05|source17/C01InteriorProps_W02/Blender/P17-05.blend"
            "P18-04|source18/Assets/C01InteriorProps/C01-18-Wave02/Sources/P18-04.blend"
            "P18-05|source18/Assets/C01InteriorProps/C01-18-Wave02/Sources/P18-05.blend"
            "P19-07|source19/Assets/C01InteriorProps/C01-19-W02/Models/P19-07/P19-07.blend"
            "P19-08|source19/Assets/C01InteriorProps/C01-19-W02/Models/P19-08/P19-08.blend"
          )
          for entry in "${paths[@]}"; do
            asset="${entry%%|*}"
            file="${entry#*|}"
            test -s "$file"
            magic="$(head -c 7 "$file")"
            if [[ "$magic" != "BLENDER" ]]; then
              echo "::error::Source $asset is not native hydrated .blend at $file"
              exit 3
            fi
            mkdir -p "reports/$asset"
            blender --background "$file" --python standards/Tools/c01_mesh_repair/topology_audit.py -- --asset-id "$asset" --stage BEFORE --out "reports/$asset/mesh_topology_before.json"
          done
      - name: Publish measured original source audits (not repaired models)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: C01-01-PASS03-SIX-ORIGINAL-BLEND-AUDITS
          path: reports/
          if-no-files-found: warn
