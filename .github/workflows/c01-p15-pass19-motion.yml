name: C01-15 PASS19 existing native P15-03 hinge motion QA

on:
  push:
    branches:
      - c01/props-15-installations
    paths:
      - .github/workflows/c01-p15-pass19-motion.yml
      - Tools/C01MeshPass19/P15/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  existing-native-p15-03:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout current frozen producer branch (do NOT export again)
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Hydrate only original P15-03 binary sources and 3 FBX from Git LFS
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include="Assets/C01InteriorProps/P15/Sources/Blender/P15-03.blend,Assets/C01InteriorProps/P15/Models/FBX/P15-03*.fbx" --exclude=""
          test "$(head -c 7 Assets/C01InteriorProps/P15/Sources/Blender/P15-03.blend)" = "BLENDER"
          test "$(head -c 18 Assets/C01InteriorProps/P15/Models/FBX/P15-03.fbx)" = "Kaydara FBX Binary"

      - name: Install actual Blender 4.0.x with FBX dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender python3-numpy xvfb libegl1 libgl1 libgl1-mesa-dri libopengl0
          blender --version | head -4

      - name: Execute actual native .blend + imported FBX hinge sweep and SHA verification
        id: native-hinge
        shell: bash
        run: |
          mkdir -p C01_PASS19_P15_NATIVE_QA
          set -o pipefail
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a blender --background --python Tools/C01MeshPass19/P15/native_hinge_gate.py 2>&1 | tee C01_PASS19_P15_NATIVE_QA/Blender4_P15-03_motion.log


      - name: Check actual shaded and TRUE triangulated wireframe pixel data differ
        shell: bash
        run: |
          python3 - <<'PY'
          import struct,zlib,pathlib
          folder=pathlib.Path("C01_PASS19_P15_NATIVE_QA")
          def pixels(path):
              s=path.read_bytes()
              assert s[:8]==b'\x89PNG\r\n\x1a\n'
              off=8;chunks=[]
              while off<len(s):
                  n=struct.unpack_from(">I",s,off)[0];typ=s[off+4:off+8]
                  if typ==b"IDAT":chunks.append(s[off+8:off+8+n])
                  off+=n+12
              return zlib.decompress(b"".join(chunks))
          a=pixels(folder/"P15-03_POST_UV_SHADED.png")
          b=pixels(folder/"P15-03_POST_UV_REAL_TRIANGLE_WIREFRAME.png")
          assert len(a)==len(b) and a!=b,"Wireframe is not visibly distinct!"
          print("C01-15 W26 true signed-FBX shaded vs actual wireframe PIXEL DIFFERENCE PASS")
          PY
      - name: Publish ONLY corrected witness imagery and latest post UV motion QA to own PR16
        shell: bash
        run: |
          set -euo pipefail
          OUT=Assets/C01InteriorProps/P15/QA/Pass26
          mkdir -p "$OUT/Previews"
          cp C01_PASS19_P15_NATIVE_QA/P15-03_PASS26_POST_UV_NATIVE_MOTION.json "$OUT/P15-03_PASS26_POST_UV_NATIVE_MOTION.json"
          cp C01_PASS19_P15_NATIVE_QA/P15-03_POST_UV_SHADED.png "$OUT/Previews/P15-03_REAL_SHADED.png"
          cp C01_PASS19_P15_NATIVE_QA/P15-03_POST_UV_REAL_TRIANGLE_WIREFRAME.png "$OUT/Previews/P15-03_REAL_TRIANGLE_WIREFRAME.png"
          tar -cf "$RUNNER_TEMP/QA_only.tar" "$OUT/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin c01/props-15-installations
          GIT_LFS_SKIP_SMUDGE=1 git reset --hard FETCH_HEAD
          tar -xf "$RUNNER_TEMP/QA_only.tar"
          git rm -f --ignore-unmatch "$OUT/Previews/BEFORE_wire.png" "$OUT/Previews/AFTER_wire.png"
          git add "$OUT/P15-03_PASS26_POST_UV_NATIVE_MOTION.json" "$OUT/Previews/P15-03_REAL_SHADED.png" "$OUT/Previews/P15-03_REAL_TRIANGLE_WIREFRAME.png"
          git commit -m "C01-15 W26: correct AABB BVH, retest latest signed P15-03 hinge, replace false wireframes"
          git push origin HEAD:c01/props-15-installations

      - name: Upload genuine hydrated native files and measured independent QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: C01-P15-03-PASS19-REAL-NATIVE-MOTION-AND-BINARIES
          path: |
            C01_PASS19_P15_NATIVE_QA/
            Assets/C01InteriorProps/P15/Sources/Blender/P15-03.blend
            Assets/C01InteriorProps/P15/Models/FBX/P15-03.fbx
            Assets/C01InteriorProps/P15/Models/FBX/P15-03_Body.fbx
            Assets/C01InteriorProps/P15/Models/FBX/P15-03_Door.fbx
          if-no-files-found: warn
          retention-days: 14
