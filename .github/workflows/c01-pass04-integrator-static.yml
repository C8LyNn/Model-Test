name: C01 PASS04 integrator tooling static checks
on:
  push:
    branches: [c01/props-10-showcase-integration]
    paths:
      - 'C01InteriorProps/Pass04/**'
      - 'Assets/C01InteriorProps/Editor/Pass04SourceImportAudit.cs'
      - '.github/workflows/c01-pass04-integrator-static.yml'
  workflow_dispatch:
jobs:
  source-tooling:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile Python staging script (syntax only)
        run: python3 -m py_compile C01InteriorProps/Pass04/stage_real_fbx.py
      - name: Validate 36 real-source locators and QA restrictions
        run: |
          python3 - <<'PY'
          import json, pathlib, re
          p = pathlib.Path('C01InteriorProps/Pass04/source_stage_36.json')
          manifest = json.loads(p.read_text())
          rows = manifest['assets']
          assert len(rows) == 36 and len({x['id'] for x in rows}) == 36
          assert all(re.fullmatch(r'P(?:15|16|17|18|19)-0[1-8]',x['id']) for x in rows)
          assert all(re.fullmatch(r'[0-9a-f]{40}',x['source_commit']) for x in rows)
          assert all(x['independent_qa'] == 'NOT_APPROVED' for x in rows)
          assert sum(x['id'] in ('P19-05','P19-07','P19-08') for x in rows) == 3
          editor = pathlib.Path('Assets/C01InteriorProps/Editor/Pass04SourceImportAudit.cs').read_text()
          assert 'Kaydara FBX Binary' in editor
          assert 'SOURCE_PRECHECK_PASS' in editor
          assert 'C01_PASS04_FBX_Source_Inspection' in editor
          assert 'Pass04Quarantine' in editor
          assert 'NOT_RUN' in editor
          assert 'new Mesh(' not in editor and 'CreatePrimitive(' not in editor
          print('C01 PASS04 STATIC MANIFEST+SOURCE CHECKS PASS; no Blender or Unity QA was run')
          PY
      - name: Execute Python staging dry run with current checkout
        run: |
          python3 C01InteriorProps/Pass04/stage_real_fbx.py --repo . --ids P19-05 P19-07 P19-08
      - name: Assert no producer FBX was downloaded by dry-run
        run: |
          test ! -d Assets/C01InteriorProps/Pass04Incoming/P19-05
          test ! -d Assets/C01InteriorProps/Pass04Incoming/P19-07
          test ! -d Assets/C01InteriorProps/Pass04Incoming/P19-08
          echo 'DRY-RUN ISOLATION PASS (no hydrated binaries; no geometry QA)'
